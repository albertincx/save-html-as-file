<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 12px;
      width: 200px;
    }
    .header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    #langSelect {
      font-size: 11px;
      padding: 2px 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    #downloadBtn {
      width: 100%;
      padding: 8px 12px;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <select id="langSelect" aria-label="Language">
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select>
  </div>
  <button id="downloadBtn" type="button">Download HTML</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
